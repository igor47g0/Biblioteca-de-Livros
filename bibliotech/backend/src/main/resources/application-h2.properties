# ==============================================================================
# Perfil H2 em Memória - BiblioTech API (Para testes sem MySQL ativo)
# Ativar via: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Ou definindo no application.properties: spring.profiles.active=h2
# ==============================================================================
spring.application.name=bibliotech-backend-h2
server.port=8080

spring.datasource.url=jdbc:h2:mem:bibliotech_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Habilitar console H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
